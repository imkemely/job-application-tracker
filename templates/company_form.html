{% extends "base.html" %}
{% block title %}{{ 'Add Company' if mode == 'add' else 'Edit Company' }}{% endblock %}

{% block content %}
<a href="{{ url_for('companies') }}" class="text-decoration-none small">
    <i class="bi bi-arrow-left"></i> All companies
</a>

<h1 class="h3 mt-2 mb-3">{{ 'Add Company' if mode == 'add' else 'Edit ' ~ (company.company_name or 'Company') }}</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="company_name" class="form-label">Company name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="company_name" name="company_name"
                           maxlength="100" required value="{{ company.company_name or '' }}">
                </div>
                <div class="col-md-6">
                    <label for="industry" class="form-label">Industry</label>
                    <input type="text" class="form-control" id="industry" name="industry"
                           maxlength="50" placeholder="e.g. Software, Finance" value="{{ company.industry or '' }}">
                </div>
                <div class="col-12">
                    <label for="website" class="form-label">Website</label>
                    <input type="url" class="form-control" id="website" name="website"
                           maxlength="200" placeholder="https://" value="{{ company.website or '' }}">
                </div>
                <div class="col-md-6">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control" id="city" name="city"
                           maxlength="50" value="{{ company.city or '' }}">
                </div>
                <div class="col-md-6">
                    <label for="state" class="form-label">State</label>
                    <input type="text" class="form-control" id="state" name="state"
                           maxlength="50" placeholder="e.g. FL" value="{{ company.state or '' }}">
                </div>
                <div class="col-12">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="4">{{ company.notes or '' }}</textarea>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> {{ 'Add Company' if mode == 'add' else 'Save Changes' }}
                </button>
                <a href="{{ url_for('company_detail', company_id=company.company_id) if mode == 'edit' else url_for('companies') }}"
                   class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
